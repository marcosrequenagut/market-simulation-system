services:
  postgres:
    image: postgres:16
    container_name: market_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: market_ingestion
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/market_data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/market_data
    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: market_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: market_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

  training:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: market_training
    depends_on:
      - postgres
      - mlflow
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/market_data
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/app

volumes:
  pgdata:
  mlflow_data: